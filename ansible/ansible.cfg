# ansible.cfg — custos-arcae-control
#
# Site-wide Ansible defaults. Every setting here is chosen for one of three
# reasons: determinism, safety, or auditability. If you cannot name which of
# the three a setting serves, do not add it.
#
# Do not weaken the settings under "Safety" or "Auditability" without an ADR.

[defaults]
# --- Determinism -------------------------------------------------------------
inventory              = ../inventories/lab/hosts.yml
roles_path             = ./roles
collections_path       = ./collections
forks                  = 10
timeout                = 30
gathering              = smart
fact_caching           = jsonfile
fact_caching_connection = ./.ansible/facts
fact_caching_timeout   = 900
stdout_callback        = community.general.yaml
display_skipped_hosts  = False
display_ok_hosts       = True
interpreter_python     = auto_silent
deprecation_warnings   = True
command_warnings       = True
action_warnings        = True
localhost_warning      = False

# Retry files clutter the tree and leak host names into CI artefacts.
retry_files_enabled    = False

# --- Safety ------------------------------------------------------------------
# Never run as root by default. Roles that need privilege escalation declare
# `become: true` explicitly on the tasks that need it.
remote_user            = custos-operator

# Host key checking is ON. A man-in-the-middle on the management network is
# exactly the threat model this repo defends against.
host_key_checking      = True

# Refuse to run if the inventory is world-writable or the vault password file
# is not mode 0600. Ansible does this check implicitly for vault; we mirror it
# for inventory via a pre-flight assert in each playbook.

# --- Auditability ------------------------------------------------------------
# Every run writes a callback log. Production runs additionally ship events to
# the SIEM via the audit role (not yet implemented — see docs/adr/0002).
callbacks_enabled      = profile_tasks, timer, ansible.posix.log_plays
log_path               = ./.ansible/ansible.log
record_host_keys       = True
record_vars            = True

# --- Paths -------------------------------------------------------------------
# Keep transient artefacts inside the repo so CI caches them predictably and
# nothing leaks into the operator's home directory.
local_tmp              = ./.ansible/tmp
private_key_file       = ~/.ssh/id_ed25519_custos

[privilege_escalation]
become                 = False
become_method          = sudo
become_user            = root
become_ask_pass        = True

[ssh_connection]
# Multiplexing speeds up long runs but must not persist across operator
# sessions on shared bastions.
ssh_args               = -o ControlMaster=auto -o ControlPersist=15m -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=./.ssh-known-hosts/known_hosts
control_path           = ./.ansible/cp/%%h-%%p-%%r
control_path_dir       = ./.ansible/cp
pipelining             = False
scp_if_ssh             = smart
transfer_method        = smart

[persistent_connection]
connect_timeout        = 30
command_timeout        = 60

[galaxy]
server_list            = galaxy
role_file              = requirements.yml
ignore_certs           = False

# Every id in server_list MUST have a matching [galaxy_server.<id>] section with
# a url, or all galaxy operations fail with "No setting was provided for
# required configuration ... setting: url". This is what makes
# `ansible-galaxy install -r requirements.yml` work in CI.
[galaxy_server.galaxy]
url                    = https://galaxy.ansible.com

[inventory]
# Fail loudly on unparsable inventory rather than silently skipping a host.
enable_plugins         = host_list, script, auto, yaml, ini, toml
unparsed_is_failed     = True

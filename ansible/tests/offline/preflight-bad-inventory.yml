# Playbook-level preflight fixture: INVALID INVENTORY.
#
# Purpose
# -------
# Proves that ansible/playbooks/baseline-hosts.yml stops on the controller-side
# "Assert inventory contract" pre_task BEFORE any remote connection is opened.
# The host is deliberately missing `asset_id`, and it points at an unroutable
# RFC 5737 TEST-NET-3 address over SSH with a short connect timeout. If the
# preflight ordering regressed (e.g. gather_facts re-enabled, or the assert
# moved after the first remote task) the run would instead fail as UNREACHABLE
# after attempting SSH — a distinguishable signature the regression test checks
# for.
#
# This is a TEST fixture. It contains no credentials and no routable address.
# It is never used against lab or production.

---
all:
  vars:
    custos_environment: lab
    custos_site: ci-offline
  children:
    dell_hosts:
      hosts:
        ci-preflight-bad-01.test:
          # SSH to an unroutable documentation address with a hard 3s timeout
          # and BatchMode so a regression fails fast instead of prompting.
          ansible_connection: ssh
          ansible_host: 203.0.113.250
          ansible_ssh_common_args: "-o ConnectTimeout=3 -o BatchMode=yes -o StrictHostKeyChecking=no"
          # asset_id is INTENTIONALLY ABSENT -> inventory-contract assert fails.
          oob_controller:
            kind: dell-idrac9
            address: 198.51.100.240
            username_var: CUSTOS_LAB_IDRAC_USER
            password_var: CUSTOS_LAB_IDRAC_PASS  # pragma: allowlist secret (env-var NAME, not a value; requires CODEOWNER approval)

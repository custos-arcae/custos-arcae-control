# Lab inventory for custos-arcae-control.
#
# Purpose
# -------
# A disposable, non-production environment used to validate Ansible roles,
# playbooks and installer answer-file formats in CI and on operator laptops.
# Nothing here maps to a real device.
#
# Addressing
# ----------
# All addresses come from RFC 5737 documentation ranges (TEST-NET-1/2/3) and
# all hostnames use the RFC 6761 `.test` TLD. Both are reserved for examples
# and are not routable.
#
#   * 192.0.2.0/24    - management network
#   * 198.51.100.0/24 - out-of-band (iDRAC / switch console)
#   * 203.0.113.0/24  - workload / storage network
#
# Credentials
# -----------
# Lab credentials are NOT stored in this file. Ansible connects using the
# operator's SSH key and, where a device requires a password, the variable is
# resolved via `lookup('ansible.builtin.env', ...)` at run time. See
# `group_vars/all.yml`.
#
# Change control
# --------------
# Lab changes are reviewed by @custos-arcae/platform-leads via CODEOWNERS.
# A change plan is NOT required for lab-only edits (see AGENTS.md §6), but the
# PR description must state what was validated in lab.

all:
  vars:
    # Environment tag surfaced in every log line and every change-plan
    # reference. Never rename this in lab; scripts and CI match on it.
    custos_environment: lab
    custos_site: lab-01

  children:
    # -------------------------------------------------------------------------
    # Dell hosts: targets for the dell_host_baseline role and the
    # baseline-hosts.yml playbook. In lab these are typically virtualised
    # iDRAC simulators or a single rack-mounted spare.
    # -------------------------------------------------------------------------
    dell_hosts:
      hosts:
        lab-dell-01.test:
          ansible_host: 192.0.2.11
          asset_id: LAB-DELL-0001
          # Out-of-band controller for this host. Never share an iDRAC between
          # hosts, even in lab — the recovery path assumes 1:1.
          oob_controller:
            kind: dell-idrac9
            address: 198.51.100.11
            # Credential material is resolved at run time, not stored here.
            username_var: CUSTOS_LAB_IDRAC_USER
            password_var: CUSTOS_LAB_IDRAC_PASS  # pragma: allowlist secret (env-var NAME, not a value; requires CODEOWNER approval)
          # Storage layout follows the idrac_storage_volume 9.7.0 contract:
          # controller_id, spaced volume_type, and exact drive IDs. The drive
          # IDs below are FORMAT PLACEHOLDERS taken from the collection docs;
          # TODO(hardware-owners): replace with the real drive IDs discovered
          # from the lab host (idrac_storage_volume state=view) before any
          # storage apply. Storage stays verify-only until then.
          storage:
            boot:
              controller_id: "RAID.Slot.1-1"
              volume_type: "RAID 1"
              name: "custos-boot"
              capacity_gb: 960
              drives:
                id:
                  - "Disk.Bay.1:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.2:Enclosure.Internal.0-1:RAID.Slot.1-1"
            data:
              controller_id: "RAID.Slot.1-1"
              volume_type: "RAID 10"
              name: "custos-data"
              capacity_gb: 3840
              drives:
                id:
                  - "Disk.Bay.3:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.4:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.5:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.6:Enclosure.Internal.0-1:RAID.Slot.1-1"
          network:
            management:
              interface: eno1
              vlan: 10
              address: 192.0.2.11
              prefix: 24
              gateway: 192.0.2.1
            workload:
              interface: ens1f0
              vlan: 20
              address: 203.0.113.11
              prefix: 24

        lab-dell-02.test:
          ansible_host: 192.0.2.12
          asset_id: LAB-DELL-0002
          oob_controller:
            kind: dell-idrac9
            address: 198.51.100.12
            username_var: CUSTOS_LAB_IDRAC_USER
            password_var: CUSTOS_LAB_IDRAC_PASS  # pragma: allowlist secret (env-var NAME, not a value; requires CODEOWNER approval)
          # See the storage comment on lab-dell-01.test. Drive IDs are format
          # placeholders; replace with discovered IDs before any storage apply.
          storage:
            boot:
              controller_id: "RAID.Slot.1-1"
              volume_type: "RAID 1"
              name: "custos-boot"
              capacity_gb: 960
              drives:
                id:
                  - "Disk.Bay.1:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.2:Enclosure.Internal.0-1:RAID.Slot.1-1"
            data:
              controller_id: "RAID.Slot.1-1"
              volume_type: "RAID 10"
              name: "custos-data"
              capacity_gb: 3840
              drives:
                id:
                  - "Disk.Bay.3:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.4:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.5:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.6:Enclosure.Internal.0-1:RAID.Slot.1-1"
          network:
            management:
              interface: eno1
              vlan: 10
              address: 192.0.2.12
              prefix: 24
              gateway: 192.0.2.1
            workload:
              interface: ens1f0
              vlan: 20
              address: 203.0.113.12
              prefix: 24

    # -------------------------------------------------------------------------
    # Proxmox VE nodes: populated only when a lab node is commissioned. Kept
    # empty in this first change to avoid speculative stubs (AGENTS.md §2).
    # -------------------------------------------------------------------------
    proxmox_nodes:
      hosts: {}

    # -------------------------------------------------------------------------
    # Proxmox Backup Server: populated only when a lab PBS is commissioned.
    # -------------------------------------------------------------------------
    pbs_servers:
      hosts: {}

    # -------------------------------------------------------------------------
    # Management switches: lab switch or switch simulator. Populated only when
    # a lab switch is commissioned.
    # -------------------------------------------------------------------------
    management_switches:
      hosts: {}

    # -------------------------------------------------------------------------
    # Monitoring endpoints: where alerts should land in lab. Populated only
    # when the monitoring workflow is implemented.
    # -------------------------------------------------------------------------
    monitoring_endpoints:
      hosts: {}

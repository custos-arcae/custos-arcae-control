# Offline fixture inventory for CI.
#
# Purpose
# -------
# Exercises the dell_host_baseline role's LOCAL logic (authorization asserts,
# firmware drift computation, storage-layout assertions, audit event) WITHOUT
# contacting any device. Every host uses ansible_connection=local and the role
# runs with dell_host_baseline_offline=true, which suppresses all remote iDRAC
# calls (see ansible/roles/dell_host_baseline/tasks/main.yml).
#
# This file is a TEST fixture. It is never used against lab or production and
# contains no credentials. Addresses are RFC 5737 documentation ranges.

---
all:
  vars:
    custos_environment: lab
    custos_site: ci-offline
    # Offline seam: no remote calls, no apply. Fixtures supply the "discovered"
    # firmware/storage so the drift and layout logic still runs.
    dell_host_baseline_offline: true
    dell_host_baseline_apply: false
    # Non-empty so the mandatory-TLS assert passes; never dereferenced offline.
    dell_host_baseline_idrac_ca_path: "/dev/null"
    dell_host_baseline_fixture_firmware:
      BIOS: "2.11.2"
      iDRAC: "6.00.02.00"
      LifecycleController: "5.10.10.00"
      PERC: "5.11.0-0004"
      NIC: "22.9.7"
    dell_host_baseline_fixture_storage:
      boot:
        controller_id: "RAID.Slot.1-1"
        volume_type: "RAID 1"
      data:
        controller_id: "RAID.Slot.1-1"
        volume_type: "RAID 10"
    # Written without privilege escalation in offline mode.
    custos_audit_log_path: "/tmp/custos-ci-offline-audit.jsonl"

  children:
    dell_hosts:
      hosts:
        ci-offline-dell-01.test:
          ansible_connection: local
          ansible_host: 127.0.0.1
          asset_id: CI-OFFLINE-0001
          oob_controller:
            kind: dell-idrac9
            address: 198.51.100.21
            username_var: CUSTOS_LAB_IDRAC_USER
            password_var: CUSTOS_LAB_IDRAC_PASS  # pragma: allowlist secret (env-var NAME, not a value; requires CODEOWNER approval)
          storage:
            boot:
              controller_id: "RAID.Slot.1-1"
              volume_type: "RAID 1"
              name: "custos-boot"
              capacity_gb: 960
              drives:
                id:
                  - "Disk.Bay.1:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.2:Enclosure.Internal.0-1:RAID.Slot.1-1"
            data:
              controller_id: "RAID.Slot.1-1"
              volume_type: "RAID 10"
              name: "custos-data"
              capacity_gb: 3840
              drives:
                id:
                  - "Disk.Bay.3:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.4:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.5:Enclosure.Internal.0-1:RAID.Slot.1-1"
                  - "Disk.Bay.6:Enclosure.Internal.0-1:RAID.Slot.1-1"
          network:
            management:
              interface: eno1
              vlan: 10
              address: 192.0.2.21
              prefix: 24
              gateway: 192.0.2.1

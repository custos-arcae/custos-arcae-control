# Playbook-level preflight fixture: UNAUTHORIZED SCOPE (production).
#
# Purpose
# -------
# Proves that ansible/playbooks/baseline-hosts.yml refuses a production run on
# the controller side, BEFORE any remote connection, during the read-only pilot
# phase. custos_environment is `production` and a syntactically VALID
# change-plan filename is supplied on purpose: this demonstrates that a matching
# change-plan FILENAME alone does NOT authorize an execution. The play must stop
# on "Refuse production commissioning during the read-only pilot phase"
# (custos_production_commissioning_enabled defaults false), not proceed to the
# change-plan check or to SSH.
#
# The host targets an unroutable RFC 5737 address so a regression that reached
# the connection phase would fail as UNREACHABLE — a distinguishable signature.
#
# This is a TEST fixture. No credentials, no routable address, never used
# against lab or production.

---
all:
  vars:
    custos_environment: production
    custos_site: lt-vilnius-01
    # A valid-looking change-plan path. Deliberately present to prove the
    # filename match is NOT sufficient to authorize production.
    custos_change_plan: docs/change-plans/20261124-ci-preflight-fixture.md
  children:
    dell_hosts:
      hosts:
        ci-preflight-prod-01.test:
          ansible_connection: ssh
          ansible_host: 203.0.113.251
          ansible_ssh_common_args: "-o ConnectTimeout=3 -o BatchMode=yes -o StrictHostKeyChecking=no"
          asset_id: CI-PREFLIGHT-PROD-0001
          oob_controller:
            kind: dell-idrac9
            address: 198.51.100.241
            username_var: CUSTOS_LAB_IDRAC_USER
            password_var: CUSTOS_LAB_IDRAC_PASS  # pragma: allowlist secret (env-var NAME, not a value; requires CODEOWNER approval)
